[application]
brand_name = "Fratelanza"
product_name = "Fratelanza Business Suite"
environment = "production"
default_locale = "en"
currency = "EGP"
theme = "dark"
auto_backup_enabled = false
backup_directory = "backups"

[data_access]
mode = "hybrid_offline"
local_cache_path = "runtime/offline_cache.sqlite3"
separate_database_per_customer = true
require_vps_first_activation = true

[branding]
client_display_name = "Customer Company"
logo_path = ""
primary_color = "#55d6be"
allow_client_branding = true

[remote_admin]
enabled = true
api_base_url = "https://your-vps-domain.com"
api_key = ""
client_id = ""
installation_id = ""
allow_remote_support = false
allow_remote_disable = true
heartbeat_interval_seconds = 900
offline_grace_hours = 72
offline_license_cache_path = "runtime/license_cache.json"

[database]
driver = ""
server = ""
database = ""
trusted_connection = true
username = ""
password = ""
encrypt = true
trust_server_certificate = true
timeout = 30
