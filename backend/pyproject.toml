[project]
name = "fratelanza-backend"
version = "0.1.0"
description = "FastAPI backend for FRATELANZA REAL ESTATE PLATFORM"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1.0",
    "email-validator>=2.1.1",
    "fastapi>=0.111.0",
    "pydantic-settings>=2.3.0",
    "psycopg[binary]>=3.1.19",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.4",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "ruff>=0.4.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
