[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fratelanza-business-suite"
version = "0.1.0"
description = "Modern reusable Python/PyQt6 desktop business management system for Fratelanza."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Fratelanza" }
]
dependencies = [
  "PyQt6>=6.7",
  "pyodbc>=5.1",
  "python-dotenv>=1.0",
  "matplotlib>=3.9",
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "python-barcode>=0.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
fratelanza = "fratelanza.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fratelanza = ["resources/i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
