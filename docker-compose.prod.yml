# FRATELANZA Real Estate — production on the Hostinger VPS
#
# Matches the live stack on the server: compose project "fratelanza_rs", containers
# fratelanza_rs_*, public port 14136 (set APP_PORT to change it).
# Other projects on the VPS (fratelanza-chat, -office, -console, -website, erp, Hub) use
# their own names and are never touched — note fratelanza_postgres belongs to fratelanza-chat.
#
# Data volumes are external and named explicitly so a rebuild always reattaches the same
# data. DEPLOY-VPS.sh detects the volumes the running containers use and exports them.

name: fratelanza_rs

services:
  postgres:
    image: postgres:16-alpine
    container_name: fratelanza_rs_postgres
    restart: unless-stopped
    # No host port — reachable only inside the project network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fratelanza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fratelanza_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - rs_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fratelanza}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fratelanza_rs_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - rs_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fratelanza_rs_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
    networks:
      - rs_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.prod
    container_name: fratelanza_rs_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-14136}:9000"
    volumes:
      - uploads:/app/uploads:ro
    networks:
      - rs_net
    depends_on:
      - backend
    environment:
      - DOMAIN=${DOMAIN:-localhost}

networks:
  rs_net:
    driver: bridge
    name: fratelanza_rs_net

volumes:
  pg_data:
    external: true
    name: ${RS_PG_VOLUME:-fratelanza_rs_fratelanza_rs_postgres_data}
  redis_data:
    external: true
    name: ${RS_REDIS_VOLUME:-fratelanza_rs_redis_data}
  uploads:
    external: true
    name: ${RS_UPLOADS_VOLUME:-fratelanza_rs_uploads}
  backups:
    external: true
    name: ${RS_BACKUPS_VOLUME:-fratelanza_rs_backups}
