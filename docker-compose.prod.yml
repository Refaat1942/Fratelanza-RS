version: "3.9"

# FRATELANZA Production — Hostinger VPS (Port 9000)
# FULLY ISOLATED from other projects on the VPS:
# - Own folder: /opt/fratelanza
# - Own port: 9000 only (NOT 80, 443, 3000, etc.)
# - Own Docker project name: fratelanza
# - Own network, database, redis (no host ports exposed)
# - Does NOT modify system nginx or other projects

name: fratelanza

services:
  postgres:
    image: postgres:16-alpine
    container_name: fratelanza_postgres
    restart: unless-stopped
    # NO ports exposed to host — only accessible inside fratelanza network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fratelanza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fratelanza_db}
    volumes:
      - fratelanza_postgres:/var/lib/postgresql/data
    networks:
      - fratelanza_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fratelanza}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fratelanza_redis
    restart: unless-stopped
    volumes:
      - fratelanza_redis:/data
    networks:
      - fratelanza_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fratelanza_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    volumes:
      - fratelanza_uploads:/app/uploads
      - fratelanza_backups:/app/backups
    networks:
      - fratelanza_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.prod
    container_name: fratelanza_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-9000}:9000"
    volumes:
      - fratelanza_uploads:/app/uploads:ro
    networks:
      - fratelanza_net
    depends_on:
      - backend
    environment:
      - DOMAIN=${DOMAIN:-localhost}

networks:
  fratelanza_net:
    driver: bridge
    name: fratelanza_isolated_net

volumes:
  fratelanza_postgres:
  fratelanza_redis:
  fratelanza_uploads:
  fratelanza_backups:
